<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考试机 — 网页版考试系统</title>
  <link rel="icon" type="image/svg+xml" href="images/em-logo.svg">
  <link rel="apple-touch-icon" href="images/em-logo.svg">
  <meta name="msapplication-TileImage" content="images/em-logo.svg">
  <meta name="msapplication-TileColor" content="#1A1D29">
  <link rel="manifest" href="manifest.json">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Navigation Bar -->
    <div id="app-navbar"></div>
    <!-- Breadcrumb -->
    <div id="app-breadcrumb" class="px-3"></div>
    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow-1"></main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>
  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Bootstrap JS (bundled with Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Dexie.js - IndexedDB Wrapper -->
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.4/dist/dexie.js"></script>
  <!-- SheetJS - Excel Reader/Writer -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <!-- JSZip - ZIP Compression -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- docx.js - Word Document Generation -->
  <script src="https://unpkg.com/docx@9.0.2/build/index.umd.js"></script>
  <!-- FileSaver.js - File Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <!-- Application Scripts (order matters!) -->
  <!-- Core -->
  <script src="js/db.js"></script>
  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <!-- Components -->
  <script src="js/components/navbar.js"></script>
  <script src="js/components/breadcrumb.js"></script>
  <script src="js/components/pagination.js"></script>
  <script src="js/components/question-renderer.js"></script>
  <script src="js/components/exam-sidebar.js"></script>
  <script src="js/components/exam-timer.js"></script>
  <!-- Services -->
  <script src="js/services/excel.js"></script>
  <script src="js/services/exam-engine.js"></script>
  <script src="js/services/paper-gen.js"></script>
  <!-- Pages (Phase 0) -->
  <script src="js/pages/login.js"></script>
  <script src="js/pages/home.js"></script>
  <!-- Pages (Phase 1) -->
  <script src="js/pages/t2-banks.js"></script>
  <script src="js/pages/t2-bank-detail.js"></script>
  <!-- Pages (Phase 2-5) -->
  <script src="js/pages/t1-exam-practice.js"></script>
  <script src="js/pages/t1-session.js"></script>
  <script src="js/pages/t3-history.js"></script>
  <script src="js/pages/t4-wrongbook.js"></script>
  <script src="js/pages/t5-paper.js"></script>
  <script src="js/pages/t6-store.js"></script>
  <!-- Router & App (must be last) -->
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
