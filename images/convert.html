<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图标转换工具</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
    .card { background: white; padding: 20px; border-radius: 8px; margin: 10px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 600px; }
    h3 { margin-top: 0; }
    button { padding: 10px 20px; background: #4e73df; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
    button:hover { background: #3a5cc0; }
    .preview { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    img { border: 1px solid #ddd; }
    p { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h3>EM Logo 图标转换工具</h3>
    <p>从源图片生成不同尺寸的 PNG 图标，下载后放入 images 文件夹。</p>

    <h4>已有图标预览：</h4>
    <div class="preview">
      <div><img src="icon-310x310.png" width="100"><br>310×310</div>
    </div>

    <h4 style="margin-top:20px">生成其他尺寸：</h4>
    <button onclick="generate150()">生成 150×150</button>
    <button onclick="generate70()">生成 70×70</button>
  </div>

  <script>
    const img = new Image();
    img.onload = function() {
      document.body.appendChild(document.createElement('p')).textContent = '源图片已加载，可以生成其他尺寸了。';
    };
    img.src = 'icon-310x310.png';

    function generateSize(targetSize) {
      const canvas = document.createElement('canvas');
      canvas.width = targetSize;
      canvas.height = targetSize;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, targetSize, targetSize);
      const link = document.createElement('a');
      link.download = `icon-${targetSize}x${targetSize}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function generate150() { generateSize(150); }
    function generate70() { generateSize(70); }
  </script>
</body>
</html>
